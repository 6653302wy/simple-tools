name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ secrets.VPS_APP_DIR != '' && secrets.VPS_APP_DIR || '/var/www/tools' }}
      APP_NAME: simple-tools
      BRANCH: main
      REPO_URL: https://github.com/6653302wy/simple-tools.git
      RELOAD_NGINX: "1"
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
          set -euo pipefail
          sudo mkdir -p '$APP_DIR'
          sudo chown -R '$VPS_USER':'$VPS_USER' '$APP_DIR'
          if [ ! -d '$APP_DIR/.git' ]; then
            git clone '$REPO_URL' '$APP_DIR'
          fi
          cd '$APP_DIR'
          APP_DIR='$APP_DIR' APP_NAME='$APP_NAME' BRANCH='$BRANCH' RELOAD_NGINX='$RELOAD_NGINX' bash scripts/server-deploy.sh
          "

      - name: Verify domain
        shell: bash
        run: |
          set -euo pipefail
          curl -kfsSI "https://tool.6653302.xyz/timestamp"
